# =============================================================================
# LexPortal API - Konfiguracja Migracji Bazy Danych (Alembic)
# =============================================================================
#
# Ten plik konfiguracyjny zarządza narzędziem Alembic, które służy do
# wersjonowania schematu bazy danych PostgreSQL. Dzięki niemu zmiany w modelach
# SQLAlchemy mogą być w sposób kontrolowany i odwracalny wprowadzane
# na produkcyjnej bazie danych.
#
# Główne komendy (uruchamiane z katalogu /backend):
#   - Wygeneruj nową migrację: alembic revision --autogenerate -m "Opis zmian"
#   - Zastosuj migracje:       alembic upgrade head
#   - Cofnij ostatnią migrację: alembic downgrade -1
#
# =============================================================================

# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic


# template used to generate migration file names; during revision
# generation, these are filled with at least a revision identifier
# and at least one of the description or slug.
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library.
# timezone =

# max length of characters to include in the "slug" part
# of the script name
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc files to be created
# sourceless = false

# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, initial revs are runs against first,
# then second, etc.
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# the specification, which involves the syntax below, is
# the same as what is used by the Python logging module.
# see http://docs.python.org/library/logging.config.html
# for details.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
