server {
    listen ${PORT} default_server;
    server_name _; # Match any host header (important for Railway)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. API PROXY (FORCE MATCHING)
    # Using '^~' ensures this prefix match takes precedence over any other location (like the SPA fallback)
    # This prevents its requests from being served as static files from /usr/share/nginx/html
    location ^~ /api/ {
        # Standard Nginx behavior: if proxy_pass has a path (even just /),
        # it replaces the part of the URI matching the location prefix.
        # We assume BACKEND_URL is the base domain (e.g. https://backend.up.railway.app)
        proxy_pass ${BACKEND_URL}$request_uri;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Railway requires the Host header to match the backend domain for routing
        proxy_set_header Host $proxy_host;
        
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for legal processing/AI/PDF tasks
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Disable buffering for long tasks
        proxy_buffering off;
    }

    # 2. SPA Fallback (Everything else)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache policy for static assets
        location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check for Railway monitoring
    location /healthz {
        access_log off;
        return 200 "OK";
    }

    # Custom logging for easier debugging on Railway
    error_log /dev/stderr notice;
    access_log /dev/stdout combined;
}
