<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LexPortal - Najnowocześniejsza platforma prawna. Bezpieczny czat, wzory dokumentów i zarządzanie sprawami online w standardzie premium."
    />
    <title>LexPortal - Twoja Kancelaria Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: "Google Sans", "Google Sans Text", system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: var(--font-sans);
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .loading-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f172a;
          color: #f8fafc;
        }
        .loading-splash {
          background: #0f172a;
        }
      }
    </style>
  </head>

  <body
    class="bg-slate-50 text-slate-900 antialiased selection:bg-gold-500 selection:text-white font-sans"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
